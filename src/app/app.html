<div class="app-layout" [class.menu-open]="menuOpen">
  <app-pwa-install></app-pwa-install>

  @if (showSidebar && !isAdmin) {
    <app-sidebar></app-sidebar>
  }

  <main
    [class.main-content]="showSidebar && !isAdmin"
    [class.full-content]="!showSidebar || isAdmin">

    @if (showSidebar && !isAdmin) {
      <button
        class="hamburger-global"
        [class.dark]="isDarkHamburger"
        (click)="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
    }

    <router-outlet></router-outlet>
  </main>
</div>
